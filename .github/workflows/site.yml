name: Website

# Builds the landing page and docs in site/ on every PR that touches them, and deploys to
# GitHub Pages from main. One-time setup: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['site/**', 'design/**', 'docs/**', 'CHANGELOG.md', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'design/**', 'docs/**', 'CHANGELOG.md', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

# As in ci.yml: runs on main are never cancelled (the deploy job skips itself when stale).
concurrency:
  group: site-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      - name: Build (type-check + static build)
        if: github.event_name == 'pull_request'
        run: npm run build
      - name: Build for GitHub Pages
        if: github.event_name != 'pull_request'
        run: npm run build
        env:
          # The real Pages URL and path, so a custom domain works without code changes.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deploy at a time, and never cancelled.
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Runs on main aren't cancelled and push events can arrive out of order, so an older
      # commit's run may reach this point last. Deploy only if main hasn't changed the site since.
      - name: Check this is still main's latest site
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq '.files[].filename')
          if printf '%s\n' "$changed" | grep -Eq '^(site/|design/|docs/|CHANGELOG\.md$|\.github/workflows/site\.yml$)'; then
            echo "::notice::main has changed the site since $GITHUB_SHA; the newer commit's run deploys it."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
