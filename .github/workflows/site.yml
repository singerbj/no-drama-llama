name: Website

# Builds the landing page and docs in site/ on every PR that touches them, and deploys to
# GitHub Pages from main. One-time setup: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'CHANGELOG.md', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'docs/**', 'CHANGELOG.md', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build (type-check + static build)
        if: github.event_name == 'pull_request'
        run: npm run build
      - name: Build for GitHub Pages
        if: github.event_name != 'pull_request'
        run: npm run build
        env:
          # The real Pages URL and path, so a custom domain works without code changes.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
