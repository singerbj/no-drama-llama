name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app itself runs on Windows PowerShell 5.1 (powershell.exe); this leg also
          # compiles the embedded C# (GPU counters, on-screen popup).
          - { name: 'Windows PowerShell 5.1', os: windows-latest, shell: powershell }
          - { name: 'PowerShell 7 (Windows)', os: windows-latest, shell: pwsh }
          - { name: 'PowerShell 7 (Linux)',   os: ubuntu-latest,  shell: pwsh }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint + tests
        run: ./tools/Invoke-Checks.ps1 -InstallDependencies
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.shell }}
          path: testResults.xml
          if-no-files-found: ignore
