name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the branch's or PR's older run, but every run on main finishes: merges and
# the release commit land seconds apart, and each commit on main needs its own result.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-lint:
    name: Rust lint (fmt + clippy, Linux and Windows targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with:
          toolchain: "1.98"
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the settings window's frontend
        working-directory: ui
        run: npm ci && npm run build
      - name: llvm-rc (builds the exe's Windows resources when checking from Linux)
        run: |
          if ! command -v llvm-rc >/dev/null; then
            command -v llvm-rc-18 >/dev/null || ls /usr/lib/llvm-*/bin/llvm-rc >/dev/null 2>&1 ||
              { sudo apt-get update -qq && sudo apt-get install -y -qq llvm; }
            rc=$(command -v llvm-rc-18 || ls /usr/lib/llvm-*/bin/llvm-rc | sort -V | tail -n 1)
            sudo ln -sf "$rc" /usr/local/bin/llvm-rc
          fi
          llvm-rc -? | head -n 1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  ui:
    name: UI checks (audit, oxfmt, oxlint, typecheck, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Dependency audit (better-npm-audit)
        run: npm run audit
      - name: Format (oxfmt)
        run: npm run format:check
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (vitest)
        run: npm test
      - name: Build
        run: npm run build

  rust-test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the platform-independent logic; Windows also runs the Win32, process,
        # HTTP and end-to-end worker tests.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the settings window's frontend
        working-directory: ui
        run: npm ci && npm run build
      - name: Build test helpers (fake llama-server)
        run: cargo build --examples --locked
      - name: Test
        run: cargo test --all-features --locked -- --include-ignored
        env:
          PROPTEST_CASES: "1000"

  rust-build:
    name: Build Windows exe
    runs-on: windows-latest
    needs: [rust-lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the settings window's frontend
        working-directory: ui
        run: npm ci && npm run build
      - run: cargo build --release --locked
      - name: Smoke test the release binary
        shell: pwsh
        run: |
          # GUI-subsystem exe: use Start-Process -Wait to get reliable exit codes.
          function Run($a) { (Start-Process target/release/no-drama-llama.exe -ArgumentList $a -Wait -PassThru -NoNewWindow).ExitCode }
          if ((Run 'version') -ne 0) { throw 'version failed' }
          if ((Run '--help') -ne 0) { throw '--help failed' }
          if ((Run 'bogus-command') -ne 2) { throw 'a bad command must exit with 2' }
          if ((Run 'install --llama-cpp-tag') -ne 2) { throw 'a bad option must exit with 2' }
          $size = (Get-Item target/release/no-drama-llama.exe).Length / 1MB
          "Release exe: {0:N1} MB" -f $size
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: no-drama-llama-exe
          path: target/release/no-drama-llama.exe

  install-e2e:
    name: Install, run and uninstall (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [rust-build]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    defaults:
      run:
        shell: pwsh
    env:
      EXE: ${{ github.workspace }}\no-drama-llama.exe
      INSTALLED: C:\Program Files\No Drama Llama\no-drama-llama.exe
      UNINSTALL_KEY: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\NoDramaLlama
      # A 145 MB chat model: enough to prove llama-server loads it and answers a chat.
      TEST_MODEL_URL: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q8_0.gguf
      TEST_MODEL: SmolLM2-135M-Instruct-Q8_0.gguf
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: no-drama-llama-exe
      - name: Install (no model, the real llama.cpp download, power + Wake-on-LAN settings)
        run: |
          # GUI-subsystem exe: Start-Process -Wait for the exit code, output to files.
          $p = Start-Process $env:EXE -ArgumentList 'install','--model','none' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput install.out -RedirectStandardError install.err
          Get-Content install.out, install.err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "install exited with $($p.ExitCode)" }
          foreach ($f in $env:INSTALLED, 'C:\LLM\llama\llama-server.exe', 'C:\LLM\settings-backup.json') {
            if (-not (Test-Path $f)) { throw "missing after install: $f" }
          }
          if (-not (Get-ScheduledTask -TaskName 'No Drama Llama' -ErrorAction SilentlyContinue)) { throw 'logon task not registered' }
          if (-not (Test-Path $env:UNINSTALL_KEY)) { throw 'not registered in Apps & features' }
          & 'C:\LLM\llama\llama-server.exe' --version
          if ($LASTEXITCODE -ne 0) { throw "llama-server --version exited with $LASTEXITCODE" }
      - name: Add a tiny model and restart the app
        run: |
          schtasks /end /tn 'No Drama Llama' | Out-Null
          Get-Process no-drama-llama, llama-server -ErrorAction SilentlyContinue | Stop-Process -Force
          Invoke-WebRequest $env:TEST_MODEL_URL -OutFile "C:\LLM\models\$env:TEST_MODEL"
          # With --model none, install leaves settings.json to the tray app, which may not have written it yet.
          $s = if (Test-Path C:\LLM\data\settings.json) { Get-Content C:\LLM\data\settings.json -Raw | ConvertFrom-Json -AsHashtable } else { @{} }
          $s.Model = $env:TEST_MODEL
          $s.AutoUpdate = $false        # never swap in the published release mid-test
          $s.PauseWhileGaming = $false  # nothing on a runner should count as a game, but be sure
          $s.Popups = $false
          $s | ConvertTo-Json -Depth 10 | Set-Content C:\LLM\data\settings.json -Encoding utf8
          Get-Content C:\LLM\data\settings.json
          schtasks /run /tn 'No Drama Llama'
          if ($LASTEXITCODE -ne 0) { throw 'schtasks /run failed' }
      - name: The tray app starts llama-server and the API answers
        run: |
          $deadline = (Get-Date).AddMinutes(4)
          while ($true) {
            try { if ((Invoke-WebRequest http://127.0.0.1:8080/health -TimeoutSec 5).StatusCode -eq 200) { break } } catch {}
            $gaveUp = Select-String -Path C:\LLM\data\tray.log -Pattern '(fail 3)' -SimpleMatch -ErrorAction SilentlyContinue
            if ($gaveUp -or (Get-Date) -gt $deadline) {
              Get-ScheduledTaskInfo -TaskName 'No Drama Llama' | Format-List
              Get-Process no-drama-llama, llama-server -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, StartTime
              throw 'llama-server never became healthy'
            }
            Start-Sleep 3
          }
          if (-not (Get-Process no-drama-llama -ErrorAction SilentlyContinue)) { throw 'tray app is not running' }
          Invoke-RestMethod http://127.0.0.1:8080/v1/models | ConvertTo-Json -Depth 5
          $body = @{ messages = @(@{ role = 'user'; content = 'Say hello.' }); max_tokens = 16 } | ConvertTo-Json -Depth 5
          $r = Invoke-RestMethod http://127.0.0.1:8080/v1/chat/completions -Method Post -ContentType application/json -Body $body
          $r | ConvertTo-Json -Depth 5
          if (-not $r.choices[0].message.content) { throw 'empty chat completion' }
      - name: A model whose head size q8_0 can't use falls back to an f16 KV cache
        run: |
          # stories260K's attention heads are 8 wide; q8_0 needs multiples of 32.
          Invoke-WebRequest https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf -OutFile C:\LLM\models\stories260K.gguf
          $fails = @(Select-String -Path C:\LLM\data\tray.log -Pattern '(fail 3)' -SimpleMatch).Count
          $s = Get-Content C:\LLM\data\settings.json -Raw | ConvertFrom-Json -AsHashtable
          $s.Model = 'stories260K.gguf'
          $s | ConvertTo-Json -Depth 10 | Set-Content C:\LLM\data\settings.json -Encoding utf8
          # The tray app picks up settings.json edits within a few seconds and restarts the server.
          $deadline = (Get-Date).AddMinutes(2)
          while ($true) {
            try { if ((Invoke-RestMethod http://127.0.0.1:8080/v1/models -TimeoutSec 5).data.id -match 'stories260K') { break } } catch {}
            if (@(Select-String -Path C:\LLM\data\tray.log -Pattern '(fail 3)' -SimpleMatch).Count -gt $fails -or (Get-Date) -gt $deadline) {
              throw 'llama-server never came up with stories260K'
            }
            Start-Sleep 3
          }
          if (-not (Select-String -Path C:\LLM\data\tray.log -Pattern 'KV cache f16' -SimpleMatch)) { throw 'no f16 KV cache fallback in tray.log' }
          $body = @{ prompt = 'Once upon a time'; max_tokens = 16 } | ConvertTo-Json
          $r = Invoke-RestMethod http://127.0.0.1:8080/v1/completions -Method Post -ContentType application/json -Body $body
          $r | ConvertTo-Json -Depth 5
          if (-not $r.choices[0].text) { throw 'empty completion' }
      - name: Logs (before uninstall deletes them)
        if: always()
        run: |
          foreach ($f in 'C:\LLM\data\tray.log', 'C:\LLM\data\server.log') {
            if (Test-Path $f) { "===== $f"; Get-Content $f -Tail 200 }
          }
      - name: Uninstall (with the installed copy, as Settings > Apps does)
        run: |
          $p = Start-Process $env:INSTALLED -ArgumentList 'uninstall','--yes' -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput uninstall.out -RedirectStandardError uninstall.err
          Get-Content uninstall.out, uninstall.err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "uninstall exited with $($p.ExitCode)" }
          if (Select-String -Path uninstall.out, uninstall.err -Pattern "couldn't be restored" -SimpleMatch) { throw 'uninstall left settings unrestored' }
          # The installed exe deletes its own folder a few seconds after it exits.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path 'C:\Program Files\No Drama Llama') -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          $left = @('C:\Program Files\No Drama Llama', 'C:\LLM', $env:UNINSTALL_KEY) | Where-Object { Test-Path $_ }
          if ($left) { throw "left behind: $($left -join ', ')" }
          if (Get-ScheduledTask -TaskName 'No Drama Llama' -ErrorAction SilentlyContinue) { throw 'logon task left behind' }
          if (Get-Process no-drama-llama, llama-server -ErrorAction SilentlyContinue) { throw 'processes left running' }
          try { Invoke-WebRequest http://127.0.0.1:8080/health -TimeoutSec 5 | Out-Null; throw 'port 8080 still answering' } catch [System.Net.Http.HttpRequestException] {}

  setup-window-e2e:
    name: Setup window opens (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [rust-build]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: no-drama-llama-exe
      # Each runs even if another failed, to report all of them.
      - name: Setup window, elevated by UAC (Explorer unelevated as the same user)
        run: ./scripts/setup-window-e2e.ps1 -Exe "$PWD\no-drama-llama.exe" -As SameUser -Screenshot setup-uac.png
      - name: Setup window, elevated as another admin (as under Administrator Protection)
        if: success() || failure()
        run: ./scripts/setup-window-e2e.ps1 -Exe "$PWD\no-drama-llama.exe" -As OtherAdmin -Screenshot setup-other-admin.png
      - name: Settings window, elevated by UAC
        if: success() || failure()
        run: ./scripts/setup-window-e2e.ps1 -Exe "$PWD\no-drama-llama.exe" -As SameUser -Settings -Screenshot settings-uac.png
      - name: Settings window, elevated as another admin
        if: success() || failure()
        run: ./scripts/setup-window-e2e.ps1 -Exe "$PWD\no-drama-llama.exe" -As OtherAdmin -Settings -Screenshot settings-other-admin.png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: setup-window-${{ matrix.os }}
          path: "*.png"
          if-no-files-found: ignore

  release-scripts:
    name: Release scripts (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node --test scripts/release/*.test.ts
      - name: The version and tag resolve
        run: echo "$(node scripts/release/version.ts tag) (previous $(node scripts/release/version.ts previous-tag))"

  rust-audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: Cargo.toml
          command: check advisories sources

  # The one check to require: it fails if any job above failed or was cancelled.
  ci-success:
    name: CI success
    if: always()
    needs: [rust-lint, ui, rust-test, rust-build, install-e2e, setup-window-e2e, release-scripts, rust-audit]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
