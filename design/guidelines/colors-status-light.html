<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg)}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--text-muted)}.chip{height:64px;border-radius:8px}.sw b{color:var(--text);font-size:12px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--tone-running)"></div><b>Running</b><span>--tone-running</span></div><div class="sw"><div class="chip" style="background:var(--tone-loading)"></div><b>Loading</b><span>--tone-loading</span></div><div class="sw"><div class="chip" style="background:var(--tone-paused)"></div><b>Paused</b><span>--tone-paused</span></div><div class="sw"><div class="chip" style="background:var(--tone-off)"></div><b>Off</b><span>--tone-off</span></div><div class="sw"><div class="chip" style="background:var(--tone-error)"></div><b>Error</b><span>--tone-error</span></div><div class="sw"><div class="chip" style="background:var(--tone-game)"></div><b>Game</b><span>--tone-game</span></div></div></body></html>
