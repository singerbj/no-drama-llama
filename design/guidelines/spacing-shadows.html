<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation" subtitle="Borders do most of the work; shadow only on floating things" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--text-muted)}.chip{height:64px;border-radius:8px;border:1px solid var(--border)}.sw b{color:var(--text);font-weight:600;font-size:12px}</style></head><body><div class="row" style="gap:24px;padding:10px"><div class="sw"><div style="height:80px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-card)"></div><b>Card / window</b><span>--shadow-card</span></div><div class="sw"><div style="height:80px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-toast)"></div><b>Toast</b><span>--shadow-toast</span></div><div class="sw"><div style="height:80px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-savebar)"></div><b>Save bar</b><span>--shadow-savebar</span></div></div></body></html>
