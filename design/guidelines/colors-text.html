<!-- @dsCard group="Colors" viewport="700x150" name="Text & accent" subtitle="Ink, muted ink, the mint accent and danger" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--text-muted)}.chip{height:64px;border-radius:8px;border:1px solid var(--border)}.sw b{color:var(--text);font-weight:600;font-size:12px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--text)"></div><b>text</b><span>--text</span></div><div class="sw"><div class="chip" style="background:var(--text-muted)"></div><b>text-muted</b><span>--text-muted</span></div><div class="sw"><div class="chip" style="background:var(--text-faint)"></div><b>text-faint</b><span>--text-faint</span></div><div class="sw"><div class="chip" style="background:var(--accent)"></div><b>accent</b><span>--accent</span></div><div class="sw"><div class="chip" style="background:var(--accent-soft)"></div><b>accent-soft</b><span>--accent-soft</span></div><div class="sw"><div class="chip" style="background:var(--danger)"></div><b>danger</b><span>--danger</span></div></div></body></html>
