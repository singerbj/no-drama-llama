<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--text-muted)}.chip{height:64px;border-radius:8px;border:1px solid var(--border)}.sw b{color:var(--text);font-weight:600;font-size:12px}</style></head><body><fieldset style="border:1px solid var(--border);border-radius:8px;background:var(--surface);margin:0;padding:4px 16px 12px;outline:1px dashed color-mix(in srgb,var(--tone-game) 60%,transparent)"><legend style="font-weight:600;padding:0 6px;margin-left:-6px">GPU usage</legend><div style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--tone-game) 10%,transparent)"><span style="display:flex;flex-direction:column">VRAM threshold<small style="color:var(--text-muted);font-size:12.5px">Another app using this many GB or more counts as a game.</small></span><span style="font-size:11px;color:var(--grape-300)">padding 10px 0 · gap 16px</span></div></fieldset></body></html>
