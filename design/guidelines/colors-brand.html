<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--text-muted)}.chip{height:64px;border-radius:8px;border:1px solid var(--border)}.sw b{color:var(--text);font-weight:600;font-size:12px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--llama-disc)"></div><b>Llama disc</b><span>--llama-disc · #3DDC84 (= running)</span></div><div class="sw"><div class="chip" style="background:var(--llama-shades)"></div><b>Shades</b><span>--llama-shades · #17383D</span></div><div class="sw"><div class="chip" style="background:var(--llama-white)"></div><b>Llama white</b><span>--llama-white · #FFFFFF</span></div><div class="sw"><div class="chip" style="background:var(--code-bg)"></div><b>Code ground</b><span>--code-bg</span></div></div></body></html>
