<!-- @dsCard group="Colors" viewport="700x120" name="Tone surfaces" subtitle="Soft tone fills + ringed dots for banners and badges" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--text-muted)}.chip{height:64px;border-radius:8px;border:1px solid var(--border)}.sw b{color:var(--text);font-weight:600;font-size:12px}</style></head><body><div class="row"><div style="flex:1;display:flex;align-items:center;gap:10px;padding:14px;border-radius:8px;border:1px solid var(--tone-running);background:var(--tone-running-soft);font-size:12px"><span style="width:10px;height:10px;border-radius:50%;background:var(--tone-running)"></span>running</div><div style="flex:1;display:flex;align-items:center;gap:10px;padding:14px;border-radius:8px;border:1px solid var(--tone-loading);background:var(--tone-loading-soft);font-size:12px"><span style="width:10px;height:10px;border-radius:50%;background:var(--tone-loading)"></span>loading</div><div style="flex:1;display:flex;align-items:center;gap:10px;padding:14px;border-radius:8px;border:1px solid var(--tone-paused);background:var(--tone-paused-soft);font-size:12px"><span style="width:10px;height:10px;border-radius:50%;background:var(--tone-paused)"></span>paused</div><div style="flex:1;display:flex;align-items:center;gap:10px;padding:14px;border-radius:8px;border:1px solid var(--tone-off);background:var(--tone-off-soft);font-size:12px"><span style="width:10px;height:10px;border-radius:50%;background:var(--tone-off)"></span>off</div><div style="flex:1;display:flex;align-items:center;gap:10px;padding:14px;border-radius:8px;border:1px solid var(--tone-error);background:var(--tone-error-soft);font-size:12px"><span style="width:10px;height:10px;border-radius:50%;background:var(--tone-error)"></span>error</div><div style="flex:1;display:flex;align-items:center;gap:10px;padding:14px;border-radius:8px;border:1px solid var(--tone-game);background:var(--tone-game-soft);font-size:12px"><span style="width:10px;height:10px;border-radius:50%;background:var(--tone-game)"></span>game</div></div></body></html>
