<!-- @dsCard group="Colors" viewport="700x150" name="Status tones" subtitle="The five tray tones + game — the heart of the palette" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--text-muted)}.chip{height:64px;border-radius:8px;border:1px solid var(--border)}.sw b{color:var(--text);font-weight:600;font-size:12px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--tone-running)"></div><b>Running</b><span>--tone-running · #3DDC84</span></div><div class="sw"><div class="chip" style="background:var(--tone-loading)"></div><b>Loading</b><span>--tone-loading · #FFB627</span></div><div class="sw"><div class="chip" style="background:var(--tone-paused)"></div><b>Paused</b><span>--tone-paused · #5AB0FF</span></div><div class="sw"><div class="chip" style="background:var(--tone-off)"></div><b>Off</b><span>--tone-off · #A89C90</span></div><div class="sw"><div class="chip" style="background:var(--tone-error)"></div><b>Error</b><span>--tone-error · #FF5A4E</span></div><div class="sw"><div class="chip" style="background:var(--tone-game)"></div><b>Game</b><span>--tone-game · #9D8CFF</span></div></div></body></html>
