<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--text-muted)}.chip{height:64px;border-radius:8px;border:1px solid var(--border)}.sw b{color:var(--text);font-weight:600;font-size:12px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--bg)"></div><b>bg</b><span>--bg</span></div><div class="sw"><div class="chip" style="background:var(--bg-alt)"></div><b>bg-alt</b><span>--bg-alt</span></div><div class="sw"><div class="chip" style="background:var(--surface)"></div><b>surface</b><span>--surface</span></div><div class="sw"><div class="chip" style="background:var(--surface-raised)"></div><b>surface-raised</b><span>--surface-raised</span></div><div class="sw"><div class="chip" style="background:var(--field)"></div><b>field</b><span>--field</span></div><div class="sw"><div class="chip" style="background:var(--hover)"></div><b>hover</b><span>--hover</span></div></div></body></html>
