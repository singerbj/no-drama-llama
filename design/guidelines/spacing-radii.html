<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--text-muted)}.chip{height:64px;border-radius:8px;border:1px solid var(--border)}.sw b{color:var(--text);font-weight:600;font-size:12px}</style></head><body><div class="row"><div class="sw"><div style="height:64px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius-sm)"></div><b>--radius-sm</b><span>6px</span></div><div class="sw"><div style="height:64px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius-md)"></div><b>--radius-md</b><span>8px</span></div><div class="sw"><div style="height:64px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius-lg)"></div><b>--radius-lg</b><span>10px</span></div><div class="sw"><div style="height:64px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius-xl)"></div><b>--radius-xl</b><span>12px</span></div><div class="sw"><div style="height:64px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius-card)"></div><b>--radius-card</b><span>14px</span></div><div class="sw"><div style="height:64px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius-pill)"></div><b>--radius-pill</b><span>999px</span></div></div></body></html>
