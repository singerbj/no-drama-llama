[package]
name = "no-drama-llama"
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
description = "Always-on local LLM server for Windows gaming PCs that pauses while you play"
repository = "https://github.com/singerbj/no-drama-llama"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
minisign-verify = "0.3"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
global-hotkey = "0.8"
steamlocate = "2"
# Settings window. custom-protocol: always serve the bundled UI (we build with plain cargo).
tauri = { version = "2.11", default-features = false, features = ["wry", "compression", "custom-protocol"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tray-icon = "0.25"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
winreg = "0.56"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
